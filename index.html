<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Из наброска в профессию — курс по диджитал-иллюстрации</title>
<meta name="description" content="Освой базу диджитал-иллюстрации и построй на ней профессию: от первого взмаха стилусом до дохода на иллюстрации без академических знаний.">

<link rel="preload" href="fonts/Aquarelle.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/ChampagneLimousines-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/ChampagneLimousines-Bold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ======================= ПЕРВЫЙ БЛОК (обложка) =======================
     Весь текст ниже — обычный редактируемый текст, не картинка.
     Менять можно прямо здесь. Размеры и координаты — в css/style.css:
       «ПЕРВЫЙ ЭКРАН»   — координаты (числа = пиксели макета 2560×1440)
       «АНИМАЦИЯ»       — задержки и характер появления
       «ТЕЛЕФОН»        — вертикальная раскладка
================================================================= -->
<section class="hero">

  <picture class="hero__bg">
    <source srcset="img/hero-1600.webp 1600w, img/hero.webp 2560w"
            sizes="100vw" type="image/webp">
    <img src="img/hero.jpg"
         srcset="img/hero-1600.jpg 1600w, img/hero.jpg 2560w"
         sizes="100vw" alt="" fetchpriority="high" decoding="async">
  </picture>

  <div class="hero__layer">

    <h1 class="hero__title">
      <span class="t-line"><span class="t-script t-script--iz">Из</span><span class="t-word t-word--nabroska">наброска</span></span><span class="t-line"><span class="t-script t-script--v">В</span><span class="t-word t-word--prof">профессию</span></span>
    </h1>

    <p class="hero__lead">
      <span class="ln">освой базу диджитал иллюстрации</span>
      <span class="ln">и построй на ней профессию</span>
      <span class="ln ln--gap" aria-hidden="true"></span>
      <span class="ln">от первого взмаха стилусом до дохода на</span>
      <span class="ln">иллюстрации без академических знаний</span>
    </p>

    <!-- Текст кнопки и ссылку менять здесь -->
    <a class="hero__cta" href="#">Узнать подробнее</a>

    <p class="hero__facts">
      <span class="ln">2 курса</span>
      <span class="ln">60+ уроков</span>
      <span class="ln">старт 1.09.2026</span>
    </p>

  </div>
</section>

<noscript><style>
  .hero__title span, .hero__lead .ln, .hero__facts .ln, .hero__cta, .hero__bg
  { opacity: 1 !important; transform: none !important; filter: none !important;
    -webkit-clip-path: none !important; clip-path: none !important; }
</style></noscript>

<script>
/* Появление запускаем, когда шрифты уже подгрузились — иначе текст моргает.
   Страховка на 1.2 с: если шрифты не ответили, показываем всё равно. */
(function () {
  var hero = document.querySelector('.hero');
  var go = function () { hero.classList.add('is-ready'); };
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(go); setTimeout(go, 1200); }
  else { go(); }
})();
</script>

<!-- Стилус вместо курсора. На телефонах и планшетах не включается. -->
<script src="js/stylus-cursor.js" defer></script>

</body>
</html>
